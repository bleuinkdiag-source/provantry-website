<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Email verified — Provantry</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F5EDE0;
    --border: #E0D3B8;
    --brown: #4A2E18;
    --brown-soft: #8A6F52;
    --orange: #C1652F;
    --moss: #66763F;
    --moss-bg: #E9EDDB;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    color: var(--brown);
    font-family: 'Karla', system-ui, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .wrap {
    max-width: 520px;
    width: 100%;
    margin: 0 auto;
    padding: 0 24px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
  }

  .logo {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    margin: 0 auto 28px;
  }

  .check {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--moss);
    background: var(--moss-bg);
    padding: 6px 14px;
    border-radius: 999px;
    margin: 0 auto 20px;
  }

  h1 {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 6vw, 38px);
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin-bottom: 16px;
  }

  p {
    font-size: 18px;
    color: var(--brown-soft);
    max-width: 38ch;
    margin: 0 auto;
  }

  footer {
    padding: 32px 24px 40px;
    text-align: center;
    font-size: 14px;
    color: var(--brown-soft);
  }

  footer a {
    color: var(--brown);
    text-decoration: none;
    border-bottom: 1px solid var(--border);
  }

  footer a:hover {
    color: var(--orange);
    border-bottom-color: var(--orange);
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="logo.png" alt="Provantry logo">
    <div><span class="check">&#10003; Verified</span></div>
    <h1>Your email has been verified.</h1>
    <p>Please open the app to continue to organize.</p>
  </div>

  <footer>
    A Blue Ink Diagnostics, LLC product &middot;
    <a href="provantry.html">About Provantry</a>
  </footer>
</body>
</html>
